# Android: 16 KB page-size alignment of libekushe_android.so. Required by Google Play for apps
# targeting Android 15 (targetSdk 35); on a 16 KB-page phone a 4 KB-aligned library fails to load and
# the keyboard would crash at start. android/build-rust.sh checks the result.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# Voice typing (whisper.cpp through whisper-rs-sys): never tune the CPU code to the build machine.
# GitHub's Windows runners have AVX-512, and a "native" build crashed on AMD Ryzen (no AVX-512) the
# moment it started recognizing. AVX2 + FMA covers Intel since 2013 and AMD since 2015.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
