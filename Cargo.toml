[workspace]
resolver = "2"
members = [
    "crates/ekushe-core",
    "crates/ekushe-ffi",
    "crates/ekushe-cli",
    "crates/ekushe-tsf",
    "crates/ekushe-tray",
    "crates/ekushe-studio",
    "crates/ekushe-android",
    "crates/ekushe-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Ekushe Next Contributors"]
repository = "https://github.com/mahbub-khan25/ekushenext"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
once_cell = "1.20"
parking_lot = "0.12"
dirs = "5.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
