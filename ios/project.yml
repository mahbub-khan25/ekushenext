# The Xcode project, generated with XcodeGen:  cd ios && xcodegen
# (run ./build-rust.sh first: it builds the engine and puts the dictionary in Data/)
name: EkusheNext
options:
  bundleIdPrefix: com.ekushenext
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # choose your team in Xcode (Signing & Capabilities)
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/rust/iphoneos
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/rust/iphonesimulator
    OTHER_LDFLAGS: -lekushe_mobile
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  EkusheNext:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: EkusheKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ekushe Next
        CFBundleDevelopmentRegion: bn
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekushenext.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EkusheKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist"]
      - Shared
      - path: Data
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Ekushe Next
        CFBundleDevelopmentRegion: bn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: bn-BD
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ekushenext.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
  EkusheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      - Keyboard/KeyboardView.swift
      - Keyboard/Typist.swift
      - path: Data
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ekushenext.app.tests
schemes:
  EkusheNext:
    build:
      targets:
        EkusheNext: all
    test:
      targets:
        - EkusheTests
      environmentVariables:
        SHOTS_DIR: $(SRCROOT)/../shots
