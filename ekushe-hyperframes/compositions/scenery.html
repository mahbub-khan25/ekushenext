<template>
  <style>
    @font-face { font-family: 'Hind Siliguri'; src: url('assets/fonts/HindSiliguri-Regular.ttf'); font-weight: 400 500; }
    @font-face { font-family: 'Hind Siliguri'; src: url('assets/fonts/HindSiliguri-SemiBold.ttf'); font-weight: 600; }
    @font-face { font-family: 'Hind Siliguri'; src: url('assets/fonts/HindSiliguri-Bold.ttf'); font-weight: 700 900; }
    @font-face { font-family: 'Inter Tight'; src: url('assets/fonts/InterTight.woff2'); font-weight: 300 900; }
    @font-face { font-family: 'Ekushe Mono'; src: url('assets/fonts/DejaVuSansMono-Bold.ttf'); }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #scenery-sky, #scenery-glow, #scenery-rays, #scenery-stars, #scenery-group { position: absolute; inset: 0; }
    #scenery-field { position: absolute; left: -432px; bottom: -768px; width: 2304px; height: 1587px; border-radius: 50%;
      background: radial-gradient(ellipse, #0F8A5F 0%, rgba(11,107,74,0.5) 45%, rgba(11,107,74,0) 72%); filter: blur(40px); }
    #scenery-sun { position: absolute; left: 0; top: 0; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #FF4B57 0%, #E0303F 55%, #B81E2C 100%);
      box-shadow: 0 0 160px 40px rgba(224,48,63,0.55), 0 0 420px 120px rgba(224,48,63,0.25); }
    #scenery-minar { position: absolute; left: 135px; top: 1180px; }
    #scenery-mist { position: absolute; left: 0; right: 0; top: 2070px; height: 700px; }
  </style>
  <!-- The night sky, the sun rising from below and the Shaheed Minar it lights (LaunchReveal.tsx Scenery).
       16 s: fully lit. From 22 s it settles low behind the scenes; from 76 s it rises a little for the ending. -->
  <div data-hf-id="hf-79bh" id="root" data-composition-id="scenery" data-width="1440" data-height="2560">
    <div data-hf-id="hf-v43s" id="scenery-sky"></div>
    <div data-hf-id="hf-ryq2" id="scenery-glow"></div>
    <div data-hf-id="hf-dnvg" id="scenery-stars"></div>
    <div data-hf-id="hf-el5i" id="scenery-rays"></div>
    <div data-hf-id="hf-3djz" id="scenery-field"></div>
    <div data-hf-id="hf-rd5i" id="scenery-group">
      <div data-hf-id="hf-sq1l" id="scenery-sun"></div>
      <div data-hf-id="hf-fv1a" id="scenery-minar"></div>
      <div data-hf-id="hf-yave" id="scenery-mist"></div>
    </div>
  </div>
  <script>
    (function () {
      const { R } = EK.L;
      const W = 1440, H = 2560, MB = 2080, MH = 900, SUN_Y = MB - MH + MH * 0.47;
      const $ = (id) => document.getElementById(id);
      const sky = $('scenery-sky'), glow = $('scenery-glow'), rays = $('scenery-rays'), field = $('scenery-field');
      const group = $('scenery-group'), sun = $('scenery-sun'), mist = $('scenery-mist');

      // stars
      const stars = [];
      for (let i = 0; i < 110; i++) {
        const s = 2 + EK.random(`ss${i}`) * 4;
        const d = EK.el('div', `position:absolute;left:${EK.random(`sx${i}`) * W}px;top:${EK.random(`sy${i}`) * H * 0.75}px;width:${s}px;height:${s}px;border-radius:9px;background:#fff;box-shadow:0 0 ${s * 2}px #fff`, $('scenery-stars'));
        stars.push({ d, sp: 14 + EK.random(`tw${i}`) * 30, i });
      }

      // the Minar: five open frames with bars, the tall centre one bowing forward at the top
      const h = MH, w = MH * 1.3, sw = MH * 0.018;
      const frame = (x, cw, ch) => {
        const top = h - ch;
        return `<rect class="mf" x="${x}" y="${top}" width="${cw}" height="${ch}" stroke="url(#mstone)" stroke-width="${sw}" />` +
          [0.25, 0.5, 0.75].map((k) => `<line x1="${x + cw * k}" x2="${x + cw * k}" y1="${top}" y2="${h}" stroke="url(#mstone)" stroke-width="${sw * 0.45}" />`).join('');
      };
      const cx = w * 0.4, cw = w * 0.2, ch = h * 0.7, top = h - ch, lean = h * 0.22;
      $('scenery-minar').innerHTML =
        `<svg id="scenery-svg" width="${w}" height="${h * 1.05}" viewBox="0 ${-h * 0.05} ${w} ${h * 1.05}" style="overflow:visible;display:block">` +
        `<defs><linearGradient id="mstone" x1="0" y1="0" x2="0" y2="1"><stop id="ms0" offset="0%" /><stop id="ms1" offset="100%" /></linearGradient></defs>` +
        frame(w * 0.05, w * 0.1, h * 0.42) + frame(w * 0.2, w * 0.12, h * 0.56) + frame(w * 0.68, w * 0.12, h * 0.56) + frame(w * 0.85, w * 0.1, h * 0.42) +
        `<rect class="mf" x="${cx}" y="${top}" width="${cw}" height="${ch}" stroke="url(#mstone)" stroke-width="${sw}" />` +
        [0.25, 0.5, 0.75].map((k) => `<line x1="${cx + cw * k}" x2="${cx + cw * k}" y1="${top}" y2="${h}" stroke="url(#mstone)" stroke-width="${sw * 0.45}" />`).join('') +
        `<polygon class="mf" points="${cx},${top} ${cx + cw},${top} ${cx + cw + lean * 0.55},${top - lean * 0.85} ${cx + lean * 0.55},${top - lean * 0.85}" stroke="url(#mstone)" stroke-width="${sw}" stroke-linejoin="round" />` +
        [0.25, 0.5, 0.75].map((k) => `<line x1="${cx + cw * k}" y1="${top}" x2="${cx + cw * k + lean * 0.55}" y2="${top - lean * 0.85}" stroke="url(#mstone)" stroke-width="${sw * 0.45}" />`).join('') +
        `<rect id="scenery-base" x="${-w * 0.02}" y="${h * 0.99}" width="${w * 1.04}" height="${h * 0.025}" rx="${h * 0.01}" />` +
        `</svg>`;
      const svg = $('scenery-svg'), ms0 = $('ms0'), ms1 = $('ms1'), base = $('scenery-base');
      const fills = Array.from(svg.querySelectorAll('.mf'));

      const tl = gsap.timeline({ paused: true });
      EK.tick(tl, R.total, (f) => {
        const rise = EK.ease(f, R.sun, R.sun + 440);
        const lit = EK.ease(f, R.sun + 140, R.date);
        const down = EK.ease(f, R.name, R.name + 140) - EK.ease(f, R.end, R.end + 120) * 0.45;
        const sx = W / 2;
        const sy = EK.interp(rise, [0, 1], [H + 420, SUN_Y]) + Math.sin(f / 200) * 6;
        const pulse = 1 + Math.sin(f / 30) * 0.015;
        const dim = 1 - down * 0.5;
        sky.style.background = `radial-gradient(120% 80% at 50% 10%, ${EK.mix([3, 14, 10], [12, 44, 32], lit)} 0%, ${EK.mix([1, 6, 4], [3, 18, 12], lit)} 60%, #010503 100%)`;
        glow.style.background = `radial-gradient(70% 45% at 50% ${(sy / H) * 100}%, rgba(224,48,63,${0.5 * rise}) 0%, rgba(242,107,79,${0.18 * rise}) 40%, rgba(0,0,0,0) 75%)`;
        for (const s of stars) s.d.style.opacity = (0.25 + 0.6 * (0.5 + 0.5 * Math.sin(f / s.sp + s.i))) * (1 - lit * 0.85);
        rays.style.opacity = lit * 0.35 * dim;
        rays.style.background = `repeating-conic-gradient(from ${f * 0.04}deg at ${sx}px ${sy}px, rgba(255,140,120,0.16) 0deg 3deg, rgba(0,0,0,0) 3deg 11deg)`;
        rays.style.webkitMaskImage = `radial-gradient(circle at ${sx}px ${sy}px, black 0%, rgba(0,0,0,0.6) 30%, transparent 62%)`;
        field.style.opacity = 0.15 + lit * 0.75;
        group.style.transform = `translateY(${down * 430}px) scale(${1 - down * 0.38})`;
        group.style.transformOrigin = `50% ${MB}px`;
        group.style.opacity = dim;
        sun.style.transform = `translate(${sx - 300 * pulse}px, ${sy - 300 * pulse}px) scale(${pulse})`;
        sun.style.transformOrigin = '0 0';
        const stone = EK.mix([38, 58, 50], [255, 255, 255], lit);
        ms0.setAttribute('stop-color', stone);
        ms1.setAttribute('stop-color', EK.mix([26, 40, 35], [214, 226, 220], lit));
        const fill = `rgba(255,255,255,${0.02 + lit * 0.05})`;
        for (const r of fills) r.setAttribute('fill', fill);
        base.setAttribute('fill', stone);
        base.setAttribute('opacity', 0.4 + lit * 0.2);
        svg.style.filter = `drop-shadow(0 0 ${MH * 0.03 * lit}px rgba(255,120,110,${0.55 * lit}))`;
        mist.style.background = `linear-gradient(180deg, ${EK.mix([2, 10, 7], [5, 30, 21], lit)} 0%, #010503 100%)`;
      });
      window.__timelines["scenery"] = tl;
    })();
  </script>
</template>
