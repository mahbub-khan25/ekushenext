  <script>
    (function () {
      const s = (fr) => fr / 60;
      const $ = (id) => document.getElementById(id);
      const { L, C } = EK;
      const len = L.R.party - L.R.phones;
      EK.icons($('root'));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#phones-head', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 2, ease: EK.sp({ damping: 16, stiffness: 90 }) }, s(4));
      const rise = { damping: 15, stiffness: 80 };
      tl.fromTo('#phones-a-wrap', { opacity: 0, y: 120, rotation: -10 }, { opacity: 1, y: 0, rotation: -4, duration: 2, ease: EK.sp(rise) }, s(24));
      tl.fromTo('#phones-i-wrap', { opacity: 0, y: 160, rotation: 10 }, { opacity: 1, y: 40, rotation: 4, duration: 2, ease: EK.sp(rise) }, s(44));
      // the ribbons spring on ("today" on Android, "soon" on iPhone) (frame 60 of each phone's own clock in the original)
      ['a', 'i'].forEach((k) => tl.fromTo(`#ph-${k}-ribbon`, { scale: 0, rotation: -8 }, { scale: 1, rotation: 12, duration: 2, ease: EK.sp({ damping: 12 }) }, s(60)));
      tl.fromTo('#phones-bar', { scaleX: 0 }, { scaleX: 0.82, duration: s(440), ease: 'power2.out' }, s(80));
      const finI = EK.endOf(EK.plan(L.phone.tokens, L.phone.ios));
      tl.fromTo('#phones-quote', { opacity: 0 }, { opacity: 1, duration: s(25), ease: 'power2.out' }, s(finI + 20));
      tl.to('#phones-out', { opacity: 0, filter: 'blur(10px)', duration: s(24), ease: 'power2.out' }, s(len - 24));

      // typing and sending on each phone
      const TR = window.EK_TRACE || {};
      const phones = [['a', L.phone.android, { ink: '#111', accent: '#3C7BF0' }, L.phone.android_tokens, TR.android], ['i', L.phone.ios, { ink: '#111', accent: '#0A84FF' }, L.phone.tokens, TR.phone]].map(([k, start, col, tokens, trace]) => {
        const P = EK.plan(tokens, start);
        const strip = $(`ph-${k}-strip`);
        let stripKey = '';
        const fin = EK.endOf(P);
        const sent = $(`ph-${k}-sent`);
        sent.textContent = P.map((w) => w.b).join(' ');
        const field = $(`ph-${k}-field`);
        const write = EK.Written(field, { ink: col.ink, accent: col.accent, size: 34 });
        const send = $(`ph-${k}-send`);
        return (f) => {
          const t = EK.typing(f, P, trace);
          const sk = (t.cands || []).join('|');
          if (sk !== stripKey) {
            stripKey = sk;
            strip.innerHTML = (t.cands || []).map((w, i) => `<div class="ph-chip${i === 0 ? ' sel' : ''}">${w}${/^[\x00-\x7F]+$/.test(w) ? '<span class="en">EN</span>' : ''}</div>`).join('');
          }
          const isSent = f >= fin + 16;
          field.style.display = isSent ? 'none' : 'block';
          write(t.done, t.live, f);
          const fly = EK.spring(f - fin - 16, { damping: 14, stiffness: 120 });
          sent.style.display = isSent ? 'block' : 'none';
          sent.style.opacity = fly;
          sent.style.transform = `translateY(${(1 - fly) * 60}px) scale(${0.85 + fly * 0.15})`;
          send.style.transform = `scale(${f >= fin && f < fin + 20 ? 0.88 : 1})`;
        };
      });
      EK.tick(tl, len, (f) => phones.forEach((p) => p(f)));
      window.__timelines["phones"] = tl;
    })();
  </script>
