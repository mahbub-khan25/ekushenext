  <script>
    (function () {
      const s = (fr) => fr / 60;
      const tl = gsap.timeline({ paused: true });
      // "অপেক্ষার প্রহর শেষে" fades up out of a blur, then away (frames 90–150 in, 400–450 out)

      // "নতুন ভোর" as the sun comes up (640–700 in, 900–950 out)
      tl.fromTo('#dark-dawn', { opacity: 0, y: 30, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: s(60), ease: 'power2.out' }, s(640));
      tl.to('#dark-dawn', { opacity: 0, y: 30, scale: 0.96, duration: s(50), ease: 'power2.out' }, s(900));

      window.__timelines["dark"] = tl;
