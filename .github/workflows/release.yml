name: Release

# To publish a release, change .github/release/VERSION (e.g. v0.1.0-beta.5) and push to main
# (or push a tag v*). Versions with a dash (beta, rc) are marked as pre-releases. A version that is
# already released is skipped.
on:
  push:
    branches: [main]
    paths: ['.github/release/VERSION']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # lets the Windows job sign in to Azure for code signing, without a stored password

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(tr -d '[:space:]' < .github/release/VERSION)"; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      # Code signing with Azure Artifact Signing. Runs once the repository has the settings from
      # docs/CODE_SIGNING.md; until then releases are published unsigned.
      - name: Azure sign-in (code signing)
        if: vars.SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign ekushe.exe, ekushe_tsf.dll, ekushe-cli.exe
        if: vars.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\ekushe.exe
            ${{ github.workspace }}\target\release\ekushe_tsf.dll
            ${{ github.workspace }}\target\release\ekushe-cli.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check signatures
        if: vars.SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          foreach ($f in 'ekushe.exe','ekushe_tsf.dll','ekushe-cli.exe') {
            $sig = Get-AuthenticodeSignature "target\release\$f"
            Write-Host "$f : $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$f is not validly signed"; exit 1 }
          }
      - name: Install check
        shell: pwsh
        timeout-minutes: 5
        run: |
          Copy-Item target\release\ekushe.exe "$env:RUNNER_TEMP\Ekushe-Setup.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\Ekushe-Setup.exe" -ArgumentList '--auto-install','--no-launch' -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Ekushe\ekushe.exe")) { Write-Error "install failed"; exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          # One program, two names: "setup" in the name opens the installer
          Copy-Item target\release\ekushe.exe dist\Ekushe-Setup.exe
          Copy-Item target\release\ekushe.exe dist\Ekushe-Portable.exe
          # Browsers block a bare .exe more often than a .zip
          Compress-Archive -Path dist\Ekushe-Setup.exe -DestinationPath dist\Ekushe-Setup.zip
          Compress-Archive -Path target\release\ekushe_tsf.dll, target\release\ekushe-cli.exe -DestinationPath dist\Ekushe-Extras-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  macos:
    name: macOS (Apple silicon + Intel)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests
        run: cargo test -p ekushe-core -p ekushe-ffi --features "ekushe-ffi/studio ekushe-ffi/embedded-dict"
      - name: Build Ekushe.app, .pkg and .zip
        run: platform/macos/build.sh "${{ needs.version.outputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build/macos/Ekushe-macOS.pkg
            build/macos/Ekushe-macOS.zip

  linux:
    name: Linux (.deb, .rpm, AppImage)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-22.04   # oldest supported glibc, so the packages run on newer distributions too
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q libibus-1.0-dev ibus python3-gi gir1.2-ibus-1.0 dbus libfuse2
      - name: Engine and Studio tests
        run: cargo test -p ekushe-core -p ekushe-ffi -p ekushe-studio --features "ekushe-ffi/studio ekushe-ffi/embedded-dict"
      - name: Build packages and type into a real IBus
        run: platform/linux/build.sh "${VERSION}" --test
        env:
          VERSION: ${{ needs.version.outputs.tag }}
      - name: Install the .deb and type again
        run: |
          sudo apt-get install -y -q ./build/linux/ekushe_*_amd64.deb
          rm -rf ~/.config/ibus/bus
          dbus-run-session -- bash -c 'ibus-daemon --xim=false --panel=disable --emoji-extension=disable --cache=none --config=disable & for i in $(seq 1 50); do F=$(ls ~/.config/ibus/bus/* 2>/dev/null | head -1); [ -n "$F" ] && break; sleep 0.2; done; export $(grep "^IBUS_ADDRESS=" "$F"); python3 platform/linux/ibus/test_engine.py'
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/linux/*.deb
            build/linux/*.rpm
            build/linux/*.AppImage

  fedora:
    name: Fedora (install the .rpm and type)
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: pkgs
      - name: Install
        run: dnf install -y ./pkgs/*.rpm python3-gobject dbus-daemon dbus-tools
      - name: Type into IBus
        run: |
          rm -rf ~/.config/ibus/bus
          dbus-run-session -- bash -c 'ibus-daemon --xim=false --panel=disable --emoji-extension=disable --cache=none --config=disable & for i in $(seq 1 50); do F=$(ls ~/.config/ibus/bus/* 2>/dev/null | head -1); [ -n "$F" ] && break; sleep 0.2; done; export $(grep "^IBUS_ADDRESS=" "$F"); python3 platform/linux/ibus/test_engine.py'

  publish:
    needs: [version, windows, macos, linux, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ekushe Next ${{ needs.version.outputs.tag }}
          body_path: .github/release/notes.md
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: dist/*
