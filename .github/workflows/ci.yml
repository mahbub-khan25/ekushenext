name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tests (core engine, dictionary, converter)
        run: cargo test --workspace
      - name: Release build (tray app with embedded dictionary, TSF DLL, CLI)
        run: cargo build --release --workspace
      - name: Pilot accuracy
        run: cargo run --release -p ekushe-core --example engine_eval -- data/dictionary/ekushe.dict.z tools/dict-builder/eval/pilot.tsv
      - name: Tray self-test (Studio HTTP endpoints)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\ekushe.exe -ArgumentList '--self-test' -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Program details (icon, version, manifest) are embedded
        shell: pwsh
        run: |
          $v = (Get-Item target\release\ekushe.exe).VersionInfo
          Write-Host "$($v.ProductName) $($v.ProductVersion) — $($v.FileDescription)"
          if ($v.ProductName -ne 'Ekushe Next') { Write-Error "version resource missing"; exit 1 }
      - name: Install and uninstall (as a user would)
        shell: pwsh
        timeout-minutes: 5
        run: |
          Copy-Item target\release\ekushe.exe "$env:RUNNER_TEMP\Ekushe-Setup.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\Ekushe-Setup.exe" -ArgumentList '--auto-install','--no-launch' -PassThru -NoNewWindow -Wait
          Get-Content "$env:TEMP\ekushe-install.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $root = "$env:LOCALAPPDATA\Programs\Ekushe"
          if (-not (Test-Path "$root\ekushe.exe")) { Write-Error "missing ekushe.exe"; exit 1 }
          if (Test-Path "$root\Uninstall-Ekushe.exe") { Write-Error "second program copy should not exist"; exit 1 }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name EkusheBanglaKeyboard -ErrorAction SilentlyContinue
          if (-not $run) { Write-Error "start-with-Windows entry missing"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ekushe Next Bangla Keyboard.lnk")) { Write-Error "Start Menu shortcut missing"; exit 1 }
          Write-Host "installed OK"
          # Reinstall while Ekushe is running: the old copy must be asked to quit, not killed
          $tray = Start-Process -FilePath "$root\ekushe.exe" -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 4
          $p2 = Start-Process -FilePath "$env:RUNNER_TEMP\Ekushe-Setup.exe" -ArgumentList '--auto-install','--no-launch' -PassThru -NoNewWindow -Wait
          Get-Content "$env:TEMP\ekushe-install.log" -Tail 8 -ErrorAction SilentlyContinue
          if ($p2.ExitCode -ne 0) { Write-Error "reinstall over a running Ekushe failed"; exit 1 }
          if (-not $tray.HasExited) { Write-Error "running Ekushe did not quit when asked"; exit 1 }
          Write-Host "reinstall over running app OK"
          $u = Start-Process -FilePath "$root\ekushe.exe" -ArgumentList '--uninstall' -PassThru -NoNewWindow -Wait
          if ($u.ExitCode -ne 0) { exit $u.ExitCode }
          if (Test-Path "$root\ekushe.exe") { Write-Error "uninstall left ekushe.exe behind"; exit 1 }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ekushe Next Bangla Keyboard.lnk") { Write-Error "uninstall left the shortcut"; exit 1 }
          Write-Host "uninstalled OK"
      - name: Candidate popup previews (PNG)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\ekushe.exe -ArgumentList '--render-popup','popup-previews' -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $n = (Get-ChildItem popup-previews -Filter *.png).Count
          if ($n -lt 8) { Write-Error "expected popup previews, got $n"; exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: popup-previews
          path: popup-previews/*.png
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ekushe-windows-x64
          path: |
            target/release/ekushe.exe
            target/release/ekushe_tsf.dll
            target/release/ekushe-cli.exe

  macos:
    name: macOS input method
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Engine and Studio tests
        run: cargo test -p ekushe-core -p ekushe-ffi --features "ekushe-ffi/studio ekushe-ffi/embedded-dict"
      - name: Build Ekushe.app, .pkg and .zip
        run: platform/macos/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ekushe-macos
          path: |
            build/macos/Ekushe-macOS.pkg
            build/macos/Ekushe-macOS.zip

  linux:
    name: Linux (.deb, .rpm, AppImage)
    runs-on: ubuntu-22.04   # oldest supported glibc, so the packages run on newer distributions too
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q libibus-1.0-dev ibus python3-gi gir1.2-ibus-1.0 dbus libfuse2
      - name: Engine and Studio tests
        run: cargo test -p ekushe-core -p ekushe-ffi -p ekushe-studio --features "ekushe-ffi/studio ekushe-ffi/embedded-dict"
      - name: Build packages and type into a real IBus
        run: platform/linux/build.sh 0.0.0-dev --test
      - name: Install the .deb and type again
        run: |
          sudo apt-get install -y -q ./build/linux/ekushe_*_amd64.deb
          rm -rf ~/.config/ibus/bus
          dbus-run-session -- bash -c 'ibus-daemon --xim=false --panel=disable --emoji-extension=disable --cache=none --config=disable & for i in $(seq 1 50); do F=$(ls ~/.config/ibus/bus/* 2>/dev/null | head -1); [ -n "$F" ] && break; sleep 0.2; done; export $(grep "^IBUS_ADDRESS=" "$F"); python3 platform/linux/ibus/test_engine.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ekushe-linux
          path: |
            build/linux/*.deb
            build/linux/*.rpm
            build/linux/*.AppImage

  fedora:
    name: Fedora (install the .rpm and type)
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ekushe-linux
          path: pkgs
      - name: Install
        run: dnf install -y ./pkgs/*.rpm python3-gobject dbus-daemon dbus-tools
      - name: Engine loads on Fedora
        run: |
          ldd /usr/libexec/ekushe/ibus-engine-ekushe | grep -i "not found" && exit 1 || true
          /usr/libexec/ekushe/ibus-engine-ekushe --version
      - name: Type into IBus
        run: |
          rm -rf ~/.config/ibus/bus
          export PYTHONUNBUFFERED=1
          dbus-run-session -- bash -c 'ibus-daemon --xim=false --panel=disable --emoji-extension=disable --cache=none --config=disable --verbose > /tmp/ibus.log 2>&1 & for i in $(seq 1 50); do F=$(ls ~/.config/ibus/bus/* 2>/dev/null | head -1); [ -n "$F" ] && break; sleep 0.2; done; export $(grep "^IBUS_ADDRESS=" "$F"); python3 platform/linux/ibus/test_engine.py; rc=$?; echo "--- processes"; ls -la /proc/*/exe 2>/dev/null | grep -i ibus; echo "--- ibus-daemon log"; cat /tmp/ibus.log; exit $rc'

  dict-builder:
    name: Dictionary builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build and test
        working-directory: tools/dict-builder
        run: cargo test --release
