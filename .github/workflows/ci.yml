name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests (core engine, dictionary, converter)
        run: cargo test --workspace
      - name: Release build (tray app with embedded dictionary, TSF DLL, CLI)
        run: cargo build --release --workspace
      - name: Pilot accuracy
        run: cargo run --release -p ekushe-core --example engine_eval -- data/dictionary/ekushe.dict.z tools/dict-builder/eval/pilot.tsv
      - name: Tray self-test (Studio HTTP endpoints)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\ekushe.exe -ArgumentList '--self-test' -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Program details (icon, version, manifest) are embedded
        shell: pwsh
        run: |
          $v = (Get-Item target\release\ekushe.exe).VersionInfo
          Write-Host "$($v.ProductName) $($v.ProductVersion) — $($v.FileDescription)"
          if ($v.ProductName -ne 'Ekushe Next') { Write-Error "version resource missing"; exit 1 }
      - name: Install and uninstall (as a user would)
        shell: pwsh
        timeout-minutes: 5
        run: |
          Copy-Item target\release\ekushe.exe "$env:RUNNER_TEMP\Ekushe-Setup.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\Ekushe-Setup.exe" -ArgumentList '--auto-install','--no-launch' -PassThru -NoNewWindow -Wait
          Get-Content "$env:TEMP\ekushe-install.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $root = "$env:LOCALAPPDATA\Programs\Ekushe"
          if (-not (Test-Path "$root\ekushe.exe")) { Write-Error "missing ekushe.exe"; exit 1 }
          if (Test-Path "$root\Uninstall-Ekushe.exe") { Write-Error "second program copy should not exist"; exit 1 }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name EkusheBanglaKeyboard -ErrorAction SilentlyContinue
          if (-not $run) { Write-Error "start-with-Windows entry missing"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ekushe Next Bangla Keyboard.lnk")) { Write-Error "Start Menu shortcut missing"; exit 1 }
          Write-Host "installed OK"
          # Reinstall while Ekushe is running: the old copy must be asked to quit, not killed
          $tray = Start-Process -FilePath "$root\ekushe.exe" -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 4
          $p2 = Start-Process -FilePath "$env:RUNNER_TEMP\Ekushe-Setup.exe" -ArgumentList '--auto-install','--no-launch' -PassThru -NoNewWindow -Wait
          Get-Content "$env:TEMP\ekushe-install.log" -Tail 8 -ErrorAction SilentlyContinue
          if ($p2.ExitCode -ne 0) { Write-Error "reinstall over a running Ekushe failed"; exit 1 }
          if (-not $tray.HasExited) { Write-Error "running Ekushe did not quit when asked"; exit 1 }
          Write-Host "reinstall over running app OK"
          $u = Start-Process -FilePath "$root\ekushe.exe" -ArgumentList '--uninstall' -PassThru -NoNewWindow -Wait
          if ($u.ExitCode -ne 0) { exit $u.ExitCode }
          if (Test-Path "$root\ekushe.exe") { Write-Error "uninstall left ekushe.exe behind"; exit 1 }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ekushe Next Bangla Keyboard.lnk") { Write-Error "uninstall left the shortcut"; exit 1 }
          Write-Host "uninstalled OK"
      - name: Candidate popup previews (PNG)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\ekushe.exe -ArgumentList '--render-popup','popup-previews' -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $n = (Get-ChildItem popup-previews -Filter *.png).Count
          if ($n -lt 8) { Write-Error "expected popup previews, got $n"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-previews
          path: popup-previews/*.png
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekushe-windows-x64
          path: |
            target/release/ekushe.exe
            target/release/ekushe_tsf.dll
            target/release/ekushe-cli.exe

  dict-builder:
    name: Dictionary builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        working-directory: tools/dict-builder
        run: cargo test --release
